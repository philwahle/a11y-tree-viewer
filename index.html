<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interaktives Lernwerkzeug: Aus HTML-Code den Accessibility Tree ableiten – mit Rolle, Name und Zustand jedes Elements."
    />
    <title>Accessibility Tree Viewer</title>
    <script>
      // Apply the stored color scheme before first paint (see useTheme.ts)
      try {
        const mode = localStorage.getItem("a11y-tree-theme");
        const dark =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
